<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A2A Incident Mesh</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #8b5cf6;
      --border: #334155; --success: #10b981;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .topology { display: flex; gap: 20px; justify-content: center; margin: 30px 0; }
    .node { 
      background: #2dd4bf; color: #0f172a; padding: 15px; border-radius: 50%; width: 100px; height: 100px; 
      display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold;
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
    }
    .node.coordinator { background: var(--accent); box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); color: white;}
    button { background: var(--accent); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { filter: brightness(1.1); }
    .streams { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .stream-box { background: #000; color: #32cd32; font-family: monospace; padding: 15px; height: 250px; overflow-y: auto; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>A2A Incident Response Mesh</h1>
    
    <div class="card" style="text-align: center;">
      <div class="topology">
        <div class="node">SRE Agent<br><small>Port 4001</small></div>
        <div class="node coordinator" style="width:120px; height:120px; font-size:1.1em;">Coordinator<br><small>Port 3000</small></div>
        <div class="node" style="background: #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);">Security Agent<br><small>Port 4002</small></div>
      </div>
      <button onclick="dispatchIncident()">Simulate Incident (Dispatch Tasks)</button>
    </div>

    <div class="streams" id="streams-container">
      <!-- Streams will appear here -->
    </div>
  </div>

  <script>
    const AGENTS = ['http://localhost:4001', 'http://localhost:4002'];

    async function registerAgents() {
      for (const url of AGENTS) {
        await fetch('http://localhost:3000/api/agents/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        }).catch(e => console.error("Failed to register", url));
      }
    }

    async function dispatchIncident() {
      const container = document.getElementById('streams-container');
      container.innerHTML = 'Registering agents & delegating tasks...';
      
      await registerAgents();

      try {
        const res = await fetch('http://localhost:3000/api/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            incidentId: 'INC-1001',
            tasks: ['analyze-telemetry', 'check-cves']
          })
        });
        const data = await res.json();
        
        container.innerHTML = '';
        data.delegations.forEach(d => {
          if (d.status === 'dispatched') {
            const box = document.createElement('div');
            box.innerHTML = `<h3>${d.agent} (${d.taskReq})</h3><div class="stream-box" id="${d.taskId}">Connecting stream...</div>`;
            container.appendChild(box);
            
            // Reconstruct Agent URL based on taskReq
            const agentUrl = d.taskReq === 'analyze-telemetry' ? 'http://localhost:4001' : 'http://localhost:4002';
            
            // Connect SSE directly to agent using Bearer token
            // Note: EventSource doesn't support custom headers easily. 
            // The agents' index.js accepts 'mesh-secret-token'. 
            // In a real app, we'd use fetch() to stream, but EventSource might bypass auth if we don't handle it.
            // Wait, the agent code says: `if (!auth || auth !== 'Bearer mesh-secret-token') { return res.status(401).json({ error: 'Unauthorized' }); }`
            // So we must use fetch to stream JSON!
            
            const logBox = document.getElementById(d.taskId);
            
            async function consumeStream() {
              const response = await fetch(`${agentUrl}/api/v1/tasks/${d.taskId}/stream`, {
                headers: { 'Authorization': 'Bearer mesh-secret-token' }
              });
              
              const reader = response.body.getReader();
              const decoder = new TextDecoder("utf-8");
              
              logBox.innerHTML = '';
              while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\\n');
                for (const line of lines) {
                  if (line.startsWith('data: ')) {
                    try {
                      const msg = JSON.parse(line.substring(6));
                      const state = msg.statusUpdate ? msg.statusUpdate.state : msg.state;
                      const desc = msg.statusUpdate ? msg.statusUpdate.description : msg.description;
                      if (desc) {
                        logBox.innerHTML += `> [${state}] ${desc}<br>`;
                        logBox.scrollTop = logBox.scrollHeight;
                      }
                    } catch (e) {}
                  }
                }
              }
            }
            consumeStream();
          } else {
             const box = document.createElement('div');
             box.innerHTML = `<h3>${d.taskReq}</h3><div class="stream-box" style="color: red">Error: ${d.error || d.reason}</div>`;
             container.appendChild(box);
          }
        });
      } catch (err) {
        container.innerHTML = 'Failed to dispatch tasks';
      }
    }
  </script>
</body>
</html>
